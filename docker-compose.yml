services:
  db:
    image: postgres:16
    container_name: pokedao-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokedao
      POSTGRES_PASSWORD: pokedao
      POSTGRES_DB: pokedao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedao -d pokedao"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pokedao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: pokedao-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://pokedao:pokedao@db:5432/pokedao"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12

  workers:
    build:
      context: .
      dockerfile: ./apps/agent/Dockerfile
    container_name: pokedao-workers
    command: ["pnpm", "run", "workers"]
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://pokedao:pokedao@db:5432/pokedao"
      REDIS_URL: "redis://redis:6379"
      DATA_WORKERS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  processor:
    build:
      context: .
      dockerfile: ./apps/agent/Dockerfile
    container_name: pokedao-processor
    command: ["pnpm", "run", "processor"]
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://pokedao:pokedao@db:5432/pokedao"
      REDIS_URL: "redis://redis:6379"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      workers:
        condition: service_started

  warehouse:
    build:
      context: .
      dockerfile: ./apps/agent/Dockerfile
    container_name: pokedao-warehouse
    command: ["pnpm", "run", "warehouse"]
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://pokedao:pokedao@db:5432/pokedao"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: ./bot/Dockerfile
    container_name: pokedao-bot
    environment:
      NODE_ENV: development
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-dummy_token}
      DATABASE_URL: "postgresql://pokedao:pokedao@db:5432/pokedao"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./bot:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    container_name: pokedao-dashboard
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://api:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
