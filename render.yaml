# Render.com Blueprint for PokeDAO API
# This file enables one-click deployment to Render

services:
  - type: web
    name: pokedao-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm -r build
    startCommand: cd api && pnpm start
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: LOG_LEVEL
        value: info

      # Database (you'll need to add your production DB URL)
      - key: DATABASE_URL
        sync: false

      # Redis (you'll need to add your production Redis URL)
      - key: REDIS_URL
        sync: false

      # eBay MAD Configuration (set in Render dashboard - DO NOT commit secrets)
      - key: EBAY_MAD_VERIFICATION_TOKEN
        sync: false

      - key: EBAY_MAD_ENDPOINT_URL
        value: https://pokedao-api.onrender.com/webhooks/ebay/mad

      # eBay API (set in Render dashboard - DO NOT commit secrets)
      - key: EBAY_APP_ID
        sync: false

      # Pokemon TCG API (set in Render dashboard - DO NOT commit secrets)
      - key: POKEMON_TCG_API_KEY
        sync: false

      - key: POKEMON_TCG_API_BASE
        value: https://api.pokemontcg.io/v2

      # Telegram Bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_ADMIN_USERNAMES
        value: @ChicoPanama

      # JustTCG
      - key: JUSTTCG_API_KEY
        sync: false

      # AI Models
      - key: DEEPSEEK_API_KEY
        sync: false

      # Other configs
      - key: TZ
        value: UTC

    healthCheckPath: /health

    autoDeploy: true
