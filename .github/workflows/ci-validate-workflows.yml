name: Validate Workflows

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: pnpm i
      - name: Validate workflow YAML
        run: node scripts/validate-workflows.js
